name: Train Rasa Model

on:
  workflow_dispatch:
    inputs:
      rasa_version:
        description: 'Rasa version'
        required: true
        default: '3.6.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libpq-dev

      - name: Upgrade Pip and Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Rasa Framework and Unified Dependencies
        run: |
          #  Bundling all constraints together forces pip to respect Copilot's pins without overwriting them
          pip install
            "sentry-sdk>=1.30.0,<2.0.0"
            "packaging>=24.0"
            "urllib3>=1.25.4,<1.27"
            rasa==${{ github.event.inputs.rasa_version }}
            --use-deprecated=legacy-resolver

      - name: Train Rasa Model
        run: |
          rasa train --out models/

      - name: Upload Trained Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rasa-model
          path: models/
