name: Train Rasa Model

on:
  workflow_dispatch:
    inputs:
      rasa_version:
        description: 'Rasa version'
        required: true
        default: '3.6.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libpq-dev

      - name: Upgrade Pip and Build Tools
        run: |
          python -m pip install --upgrade pip wheel
          pip install "setuptools<70" "sqlalchemy<2.0"

      - name: Install Rasa Framework
        run: |
          pip install rasa==${{ github.event.inputs.rasa_version }} --use-deprecated=legacy-resolver
          pip install "structlog-sentry<2.1" "sentry-sdk>=1.14,<2.0" "setuptools<70" "sqlalchemy<2.0" --force-reinstall

      - name: Train Rasa Model
        run: |
          rasa train --out models/

      - name: Upload Trained Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rasa-model
          path: models/
